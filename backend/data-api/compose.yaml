name: dya-data

# Local development stack: ClickHouse, Valkey and every data-api role, run by Bun from the
# checked-out sources. Only loopback ports are published.
x-app: &app
  image: oven/bun:1.4.4-slim
  working_dir: /app
  entrypoint: [bun, src/main.ts]
  user: "1000:1000"
  volumes: [".:/app:ro"]
  env_file: .env
  environment: &app-env
    CLICKHOUSE_URL: http://clickhouse:8123
    REDIS_URL: redis://valkey:6379
    API_PORT: "8080"
  read_only: true
  tmpfs: ["/tmp:size=64m,mode=1777"]
  stop_grace_period: 30s
  depends_on:
    clickhouse: { condition: service_healthy }
    valkey: { condition: service_healthy }

# One ingest process per venue; INGEST_VENUE only names the status key the healthcheck reads.
x-ingest: &ingest
  <<: *app
  restart: unless-stopped
  healthcheck:
    test: [CMD, bun, -e, 'import { RedisClient } from "bun"; import { liveKeys } from "./src/live/protocol.ts"; const r = new RedisClient(process.env.REDIS_URL); const s = JSON.parse(await r.get(liveKeys(process.env.INGEST_VENUE).status) || "null"); r.close(); process.exit(s && Date.now() - s.at < 30000 && s.connected ? 0 : 1);']
    interval: 15s
    timeout: 5s
    start_period: 30s
    retries: 3

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-dya}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
    ports: ["127.0.0.1:${DEV_CLICKHOUSE_PORT:-18123}:8123"]
    volumes:
      - clickhouse:/var/lib/clickhouse
      - ./clickhouse/server.xml:/etc/clickhouse-server/config.d/local.xml:ro
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/local.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:8123/ping]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9.0.3-alpine
    command: [valkey-server, --save, "", --appendonly, "no", --maxmemory, 512mb, --maxmemory-policy, noeviction]
    ports: ["127.0.0.1:${DEV_VALKEY_PORT:-16379}:6379"]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    <<: *app
    command: [api]
    ports: ["127.0.0.1:${DEV_API_PORT:-18080}:8080"]
    restart: unless-stopped
    healthcheck:
      test: [CMD, bun, -e, 'const r = await fetch("http://127.0.0.1:8080/healthz"); process.exit(r.ok ? 0 : 1)']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Exactly one writer for Terminal metadata; API workers only read its Valkey snapshot.
  token-markets:
    <<: *app
    command: [token-markets]
    restart: unless-stopped
    healthcheck:
      test: [CMD, bun, -e, 'import { RedisClient } from "bun"; import { TOKEN_MARKETS_KEY } from "./src/markets/token-markets.ts"; const r = new RedisClient(process.env.REDIS_URL); const s = JSON.parse(await r.get(TOKEN_MARKETS_KEY) || "null"); r.close(); process.exit(s && Date.now() - s.updatedAt < 1800000 ? 0 : 1);']
      interval: 60s
      timeout: 5s
      start_period: 60s
      retries: 3

  ingest-binance:
    <<: *ingest
    command: [ingest, binance]
    environment: { <<: *app-env, INGEST_VENUE: binance }

  ingest-bybit:
    <<: *ingest
    command: [ingest, bybit]
    environment: { <<: *app-env, INGEST_VENUE: bybit }

  ingest-okx:
    <<: *ingest
    command: [ingest, okx]
    environment: { <<: *app-env, INGEST_VENUE: okx }

  ingest-kucoin:
    <<: *ingest
    command: [ingest, kucoin]
    environment: { <<: *app-env, INGEST_VENUE: kucoin }

  ingest-gate:
    <<: *ingest
    command: [ingest, gate]
    environment: { <<: *app-env, INGEST_VENUE: gate }

  ingest-mexc:
    <<: *ingest
    command: [ingest, mexc]
    environment: { <<: *app-env, INGEST_VENUE: mexc }

  ingest-kraken:
    <<: *ingest
    command: [ingest, kraken]
    environment: { <<: *app-env, INGEST_VENUE: kraken }

  ingest-safetrade:
    <<: *ingest
    command: [ingest, safetrade]
    environment: { <<: *app-env, INGEST_VENUE: safetrade }

  # NEAR's finalized blocks from neardata.xyz (FASTNEAR_API_KEY), fetched once into the Valkey
  # stream `near:blocks` that ingest-rhea and ingest-intents read. Healthy while it makes progress.
  ingest-near:
    <<: *ingest
    command: [near-feed]
    healthcheck:
      test: [CMD, bun, -e, 'import { RedisClient } from "bun"; import { FEED_STATUS_KEY } from "./src/near/feed.ts"; const r = new RedisClient(process.env.REDIS_URL); const s = JSON.parse(await r.get(FEED_STATUS_KEY) || "null"); r.close(); process.exit(s && Date.now() - s.at < 30000 ? 0 : 1);']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Rhea DEX swaps from the NEAR block feed (neardata.xyz repairs gaps).
  ingest-rhea:
    <<: *ingest
    command: [ingest, rhea]
    environment: { <<: *app-env, INGEST_VENUE: rhea }

  # NEAR Intents token_diff intents (from the NEAR block feed; neardata.xyz repairs gaps) and the
  # Explorer + FastNEAR history backfill (INTENTS_EXPLORER_JWT).
  ingest-intents:
    <<: *ingest
    command: [ingest, intents]
    environment: { <<: *app-env, INGEST_VENUE: intents }

  # One-off tasks: `docker compose run --rm migrate`, `docker compose run --rm sync`.
  migrate:
    <<: *app
    profiles: [tasks]
    command: [migrate]
    restart: "no"

  sync:
    <<: *app
    profiles: [tasks]
    command: [sync]
    restart: "no"

volumes:
  clickhouse:
